<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous" />

    <!-- Favicon -->
    <link rel="icon" href="/buriganga-talkies/favicon.ico" />

    <!-- Page title -->
    <title>Buriganga Talkies</title>

    <!-- Page JS entry point (imports shared JS + CSS) -->
    <script type="module" crossorigin src="/buriganga-talkies/assets/main-CV7xJUl6.js"></script>
    <link rel="modulepreload" crossorigin href="/buriganga-talkies/assets/bootstrap.bundle.min-ImymQZ6L.js">
    <link rel="stylesheet" crossorigin href="/buriganga-talkies/assets/bootstrap.bundle-C1yQWRn6.css">
    <link rel="stylesheet" crossorigin href="/buriganga-talkies/assets/main-WFFgQOp8.css">
  </head>
  <body>
    <header>
      <!-- Navigation Bar -->
      <nav class="align-row">
        <!-- Logo -->
        <div class="nav__logo">
          <a href="#home"
            ><img src="/buriganga-talkies/assets/common/logo.png" alt="Buriganga Talkies Logo"
          /></a>
        </div>
        <!-- In-page Link -->
        <ul class="nav__links align-row" id="navLinks"></ul>
        <div class="hamburger">
          <i class="fa-solid fa-bars"></i>
        </div>
      </nav>
      <!-- Aside Overlay -->
      <div class="aside__overlay hidden"></div>
      <!-- Aside Bar -->
      <aside class="sidebar hide flex-col">
        <!-- Close Button -->
        <div class="cross">
          <i class="fa-solid fa-xmark close"></i>
        </div>
        <!-- In-page Link -->
        <ul class="aside__links flex-col" id="asideLinks"></ul>
        <!-- Aside Social Links -->
        <div
          class="aside__social-links justify-row"
          id="asideSocialLinks"></div>
      </aside>
    </header>
    <main>
      <!-- Home Section -->
      <section id="home" class="center-col">
        <!-- Movie Inspiration Name -->
        <!-- <h3 class="movie-inspiration">তানিম নূর এর ছায়াছবি</h3>
        <a href="bonolota-express.html">Bonolota Express</a>
        <a href="utshob.html">Utshob</a> -->
        <!-- Movie Title -->
        <!-- <img
          class="movie-name"
          src="/assets/buriganga-talkies/name.png"
          alt="Buriganga Talkies Logo" /> -->

        <iframe
          id="fb-iframe"
          src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Fp%2FBuriganga-Talkies-61582315140804&tabs=timeline&width=500&height=1000&small_header=true&adapt_container_width=true&hide_cover=true&show_facepile=false&appId=1192769069150497&colorscheme=dark&theme=dark"
          class="iframe-fb"
          scrolling="no"
          frameborder="0">
        </iframe>

        <div class="home__footer">
          <!-- Home Social Links -->
          <div
            class="home__social-links center-row text-h5"
            id="homeSocialLinks"></div>

          <div style="width: min(90vw, 1000px)"></div>
          <p class="scroll-text center-row">
            <i class="fa-solid fa-circle-arrow-down"></i>
            SCROLL TO LEARN MORE
          </p>
        </div>

        <video class="hero-video__bg bg-video" autoplay muted loop playsinline>
          <source src="/buriganga-talkies/assets/utshob/background.mp4" type="video/mp4" />
        </video>
      </section>

      <!-- Movies Section -->
      <section id="movies">
        <div class="container">
          <div class="movies__flex">
            <div class="movies__grid-left justify-col"><h2>MOVIES</h2></div>
            <div class="movies__grid-right">
              <div class="movie__card">
                <a href="bonolota-express.html"
                  ><img src="/buriganga-talkies/assets/common/cover-bonolota.webp" alt=""
                /></a>
                <h3>Bonolota Express</h3>
                <a href="bonolota-express.html"
                  ><button class="display__button btn-stretch">
                    <span>Learn More</span>
                  </button></a
                >
                <button
                  class="display__button btn-stretch"
                  id="bonolota-express-trailer">
                  <span>Watch Trailer</span>
                </button>
                <a href="https://www.imdb.com/title/tt38792109/"
                  ><button class="display__button btn-stretch">
                    <span>View in IMDb</span>
                  </button></a
                >
              </div>
              <div class="movie__card">
                <a href="utshob.html"
                  ><img src="/buriganga-talkies/assets/common/cover-utshob.webp" alt=""
                /></a>
                <h3>Utshob</h3>
                <a href="utshob.html"
                  ><button class="display__button btn-stretch">
                    <span>Learn More</span>
                  </button></a
                >
                <button class="display__button btn-stretch" id="utshob-trailer">
                  <span>Watch Trailer</span>
                </button>
                <a href="https://www.imdb.com/title/tt37034643"
                  ><button class="display__button btn-stretch">
                    <span>View in IMDb</span>
                  </button></a
                >
              </div>
            </div>
            <div class="modal hidden" id="videoModal">
              <div class="modal__overlay"></div>
              <div class="modal__content">
                <button class="modal__close" id="closeModal">✕</button>
                <iframe
                  id="ytPlayer"
                  title="YouTube video player"
                  frameborder="0"
                  allow="autoplay; encrypted-media; picture-in-picture"
                  allowfullscreen>
                </iframe>
              </div>
            </div>
          </div>
        </div>
      </section>
      <!-- Cast Section -->
      <!-- <section id="crew">
        <div class="container"></div>
      </section> -->

      <!-- Gallery Section -->
      <section id="gallery">
        <div class="container container-90">
          <h2>Gallery</h2>
          <div id="carouselContainer">
            <div
              id="carouselExampleIndicators"
              class="carousel slide"
              data-bs-ride="carousel"
              data-bs-interval="3000">
              <div class="carousel-indicators" id="carouselIndicators"></div>
              <div class="carousel-inner" id="carouselInner">
                <!-- Controls -->
                <button
                  class="carousel-control-prev"
                  type="button"
                  data-bs-target="#carouselExampleIndicators"
                  data-bs-slide="prev">
                  <span
                    class="carousel-control-prev-icon"
                    aria-hidden="true"></span>
                </button>
                <button
                  class="carousel-control-next"
                  type="button"
                  data-bs-target="#carouselExampleIndicators"
                  data-bs-slide="next">
                  <span
                    class="carousel-control-next-icon"
                    aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Videos Section -->
      <section id="videos">
        <div class="container">
          <h2>Videos</h2>
          <div class="scroll-wrapper-videos">
            <div class="scroll-content-videos"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Contact Section -->
    <section id="contact">
      <div class="container">
        <div class="contact__grid">
          <div class="contact__grid-left justify-col">
            <a href="index.html">
              <img src="/buriganga-talkies/assets/common/logo.png" alt="Buriganga Talkies" />
            </a>
            <p>
              A home for bold Bangladeshi storytellers; crafting films that blur
              the line between art and commerce — intimate, uncompromising,
              unforgettable.
            </p>
            <!-- Contact Info -->
            <div class="contact__info flex-col" id="contactInfo"></div>
          </div>
          <div class="contact__grid-right"></div>
        </div>
      </div>
    </section>
  </body>
</html>
